spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_site_vul
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate   
spring.jpa.show-sql=True               

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# --- VULNERABLE ON PURPOSE: lab-only settings, see INSTRUCTOR_KEY.md ---

# Verbose error pages: full stack traces and exception messages leak to
# anyone who triggers a 500 (e.g. via a malformed SQLi payload).
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=always

# Actuator wide open with no authentication: /actuator/env leaks the DB
# password and any secrets in the environment, /actuator/heapdump lets you
# pull a full JVM heap dump, /actuator/beans/mappings fingerprint the app.
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.heapdump.enabled=true
management.endpoint.health.show-details=always

# Unrestricted upload size (paired with AdminProductController's lack of
# filename/extension checks).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
